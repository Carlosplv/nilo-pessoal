<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#284f43"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Nilo"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-180.png"><link rel="icon" href="icon.svg" type="image/svg+xml"><title>Nilo · Seu dia, com mais leveza</title><link rel="stylesheet" href="style.css">
<body><aside><a class="brand" href="#">nilo<span>✳</span></a><p>SEU ASSISTENTE PESSOAL</p><nav><button data-view="today" class="active">◉ Hoje</button><button data-view="week">▦ Minha semana</button><button data-view="routines">↻ Rotinas</button><button data-view="chat">✧ Conversar</button></nav><footer>Um passo de cada vez.<br><small>Feito para você, chefe.</small></footer></aside><main><header><span id="dateLabel"></span><button id="add" class="primary">＋ Adicionar</button></header><section id="content"></section><button id="iphoneHelp" class="iphone-help">ⓘ Sobre o modo local</button><p class="storage">Seus dados ficam neste navegador. Sem sincronização entre aparelhos. <button id="export">Salvar cópia</button> <button id="import">Restaurar cópia</button><input type="file" id="file" accept="application/json" hidden></p></main>
<dialog id="editor"><form id="form"><div class="modalhead"><h2 id="formTitle">Um novo plano</h2><button type="button" id="close" aria-label="Fechar">✕</button></div><label>Nome<input id="title" required maxlength="120" placeholder="Ex.: Trabalho"></label><label>Tipo<select id="kind"><option value="event">Compromisso</option><option value="task">Tarefa</option></select></label><div class="pair"><label>Começa às<input id="start" type="time" value="06:00" required></label><label>Termina às<input id="end" type="time" value="18:00" required></label></div><label>Data / início da rotina<input id="date" type="date" required></label><label class="check"><input id="repeat" type="checkbox"> Repetir durante a semana</label><div id="repeatFields" hidden><p>Em quais dias?</p><div id="days" class="days"></div><button type="button" id="weekdays">Segunda a sexta</button><label>Último dia (opcional)<input id="until" type="date"></label></div><label>Prioridade<select id="priority"><option>Normal</option><option>Alta</option><option>Baixa</option></select></label><p id="formError" role="alert"></p><div class="actions"><button type="button" id="delete" hidden>Excluir</button><button class="primary" type="submit">Salvar plano</button></div></form></dialog><div id="toast" role="status"></div><script src="app.js"></script><script src="mobile.js"></script><script src="local-state.js"></script><script src="features.js"></script></body></html>
